<!-- req-219: variante Tailwind. `ui modal previsualizar`, `header/content/actions`, `approve` e `ui dimmer` são
     ganchos do JS do editor e da ponte de modais (controles.js); `hidden` segura o modal até a ponte montá-lo. -->
<div class="ui modal overlay fullscreen previsualizar hidden">
    <div class="header">#title#</div>
    <div class="scrolling content">
        <div class="html-editor-visual-topbar mb-4 flex flex-wrap items-center gap-2">
            <div class="c2fc-grupo">
                <button type="button" class="screenPagina c2fc-botao" data-option="desktop" data-width="100%">
                    <i data-lucide="monitor" class="size-4"></i> #desktop#
                </button>
                <button type="button" class="screenPagina c2fc-botao" data-option="tablet" data-width="768px">
                    <i data-lucide="tablet" class="size-4"></i> #tablet#
                </button>
                <button type="button" class="screenPagina c2fc-botao" data-option="mobile" data-width="375px">
                    <i data-lucide="smartphone" class="size-4"></i> #mobile#
                </button>
            </div>
            <button type="button" class="html-editor-add-btn c2fc-botao c2fc-botao-sucesso c2fc-botao-icone" data-c2f-dica-pos="bottom center" data-c2f-dica="#add-element-tooltip#" aria-label="#add-element-tooltip#">
                <i data-lucide="plus" class="size-4"></i>
            </button>
            <button type="button" class="c2f-tb-view-options c2fc-botao" data-c2f-dica-pos="bottom center" data-c2f-dica="Editor display options">
                <i data-lucide="eye" class="size-4"></i> Display Options
            </button>
            <div class="c2fc-grupo">
                <button type="button" class="html-editor-undo-btn c2fc-botao c2fc-botao-icone" data-c2f-dica-pos="bottom center" data-c2f-dica="#undo-tooltip#" aria-label="#undo-tooltip#" disabled>
                    <i data-lucide="undo-2" class="size-4"></i>
                </button>
                <button type="button" class="html-editor-redo-btn c2fc-botao c2fc-botao-icone" data-c2f-dica-pos="bottom center" data-c2f-dica="#redo-tooltip#" aria-label="#redo-tooltip#" disabled>
                    <i data-lucide="redo-2" class="size-4"></i>
                </button>
            </div>
        </div>
        <div class="html-editor-preview-stage relative flex justify-center">
            <div class="iframe-preview-frame relative w-full max-w-full">
                <div class="iframe-resize-handle iframe-resize-handle-left"></div>
                <iframe id="iframe-preview" class="block h-[calc(100vh-220px)] w-full rounded-lg border border-slate-300 bg-white"></iframe>
                <div class="iframe-resize-handle iframe-resize-handle-right"></div>
                <div class="ui dimmer c2fc-cobertura active rounded-lg">
                    <div class="c2fc-giro"></div>
                </div>
            </div>
            <div class="iframe-resize-indicator" style="display:none;">0px</div>
        </div>
    </div>
    <div class="actions">
        <button type="button" class="approve previsualizarVoltar c2fc-botao" data-c2f-dica-pos="top right" data-c2f-dica="#button-back-tooltip#">
            <i data-lucide="chevron-left" class="size-4"></i>
            #button-back-value#
        </button>
        <button type="button" class="approve previsualizarConfirmar c2fc-botao c2fc-botao-sucesso" data-c2f-dica-pos="top right" data-c2f-dica="#button-tooltip#">
            <i data-lucide="circle-check" class="size-4"></i>
            #button-value#
        </button>
    </div>
</div>
