<div data-c2f-modal="autorizacao-provisoria" data-c2f-modal-obrigatorio
    class="autorizacaoProvisoria fixed inset-0 z-[100020] hidden items-center justify-center bg-slate-900/70 p-4">
    <div role="alertdialog" aria-modal="true" class="w-full max-w-sm rounded-xl bg-white shadow-xl">
        <h2 class="border-b border-slate-200 px-5 py-3 text-base font-semibold text-slate-900">#titulo#</h2>
        <div class="px-5 py-4">
            <p class="text-sm text-slate-700">#mensagem#</p>
        </div>
        <div class="flex flex-wrap justify-end gap-2 border-t border-slate-200 px-5 py-3">
            <a href="#botao-cancelar-url#"
                class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50">#botao-cancelar#</a>
            <a href="#botao-confirmar-url#"
                class="inline-flex items-center gap-2 rounded-lg border border-sky-600 bg-sky-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-sky-700">#botao-confirmar#</a>
        </div>
    </div>
</div>
