<div data-c2f-modal="delecao" class="_interfaceDelecaoModal fixed inset-0 z-[100010] hidden items-center justify-center bg-slate-900/60 p-4">
    <div role="alertdialog" aria-modal="true" class="w-full max-w-sm rounded-xl bg-white shadow-xl">
        <h2 class="border-b border-slate-200 px-5 py-3 text-base font-semibold text-slate-900">#titulo#</h2>
        <div class="px-5 py-4">
            <p class="text-sm text-slate-700">#mensagem#</p>
        </div>
        <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3">
            <button type="button" data-c2f-modal-negar
                class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50">#botao-cancelar#</button>
            <button type="button" data-c2f-modal-aprovar
                class="inline-flex items-center gap-2 rounded-lg border border-red-600 bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700">#botao-confirmar#</button>
        </div>
    </div>
</div>
