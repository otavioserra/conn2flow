<!-- req-219: variante Tailwind dos modais de prompt da IA (ponte de modais e de formulário da biblioteca de controles). -->
<div class="ui mini tiny modal ai-prompt-save-modal hidden">
    <button type="button" class="close icon text-xl leading-none text-slate-400 hover:text-slate-700" aria-label="Close">&times;</button>
    <div class="header">
        Create New Prompt
    </div>
    <div class="content">
        <form class="ai-prompt-save-form" onsubmit="return false;">
            <div class="c2fc-campo">
                <label class="c2fc-campo-rotulo">Name</label>
                <input type="text" name="prompt-nome" class="c2fc-campo-entrada" placeholder="Prompt name..." data-validate="name">
            </div>
        </form>
    </div>
    <div class="actions">
        <button type="button" class="deny c2fc-botao">Cancel</button>
        <button type="button" class="approve c2fc-botao c2fc-botao-sucesso">Send</button>
    </div>
</div>
<div class="ui mini tiny modal confirm ai-prompt-del-modal hidden">
    <div class="header">Remove Prompt</div>
    <div class="content">
        <p>Are you sure you want to remove this prompt?</p>
    </div>
    <div class="actions">
        <button type="button" class="deny c2fc-botao">
            Cancel
        </button>
        <button type="button" class="approve c2fc-botao c2fc-botao-perigo">
            Confirm
            <i data-lucide="trash-2" class="size-4"></i>
        </button>
    </div>
</div>
