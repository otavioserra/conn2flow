<div data-c2f-modal="alerta" class="fixed inset-0 z-[100010] hidden items-center justify-center bg-slate-900/60 p-4">
    <div role="alertdialog" aria-modal="true" class="w-full max-w-md rounded-xl bg-white shadow-xl">
        <h2 class="border-b border-slate-200 px-5 py-3 text-base font-semibold text-slate-900">#titulo#</h2>
        <div class="px-5 py-4">
            <p data-c2f-modal-mensagem class="text-sm text-slate-700"></p>
        </div>
        <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3">
            <button type="button" data-c2f-modal-aprovar
                class="inline-flex items-center gap-2 rounded-lg border border-sky-600 bg-sky-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-sky-700">#botao-ok#</button>
        </div>
    </div>
</div>
