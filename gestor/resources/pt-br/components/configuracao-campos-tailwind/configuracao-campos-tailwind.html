<!-- datas-multiplas < -->
<div class="calendar-multiple campo datas-multiplas space-y-2 rounded border border-slate-200 p-3">
    <div class="calendar-dates flex flex-wrap gap-2"></div>
    <input type="date"
        class="calendarMultipleInput w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-sky-700 focus:outline-none focus:ring-1 focus:ring-sky-700"
        aria-label="@[[variable-type-data-label]]@">
    <template class="calendar-date-template">
        <span class="date-value inline-flex items-center gap-1 rounded bg-slate-100 px-2 py-1 text-sm text-slate-800">
            <span class="date-label"></span>
            <button type="button"
                class="date-delete inline-flex h-6 w-6 items-center justify-center rounded text-slate-600 hover:bg-slate-200"
                aria-label="@[[variavel-delete-btn]]@" title="@[[variavel-delete-btn]]@"><span
                    aria-hidden="true">&times;</span></button>
        </span>
    </template>
    <input type="hidden" name="valor-#value-num#" value="#value-valor#" class="calendar-dates-input">
</div>
<!-- datas-multiplas > -->
<!-- data-hora < -->
<div class="calendar campo data-hora">
    <input type="datetime-local" step="60" aria-label="@[[variable-type-data-hora-label]]@"
        class="calendarInputDisplay w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-sky-700 focus:outline-none focus:ring-1 focus:ring-sky-700">
    <input type="hidden" name="valor-#value-num#" value="#value-valor#" class="calendarInput">
</div>
<!-- data-hora > -->

    <input type="hidden" name="valor-#value-num#" value="#value-valor#" class="calendarInput">
</div>
