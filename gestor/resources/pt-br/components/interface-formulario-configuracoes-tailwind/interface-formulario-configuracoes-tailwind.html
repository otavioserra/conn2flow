<h1 class="mb-4 text-2xl font-semibold text-slate-900">#titulo#</h1>
<!-- botoes < --><div class="mb-4 flex flex-wrap justify-end gap-2">
    #botoes#
</div><!-- botoes > -->
<form id="#form-id#" action="#form-action#" method="post" name="#form-name#" data-c2f-form="tailwind" class="interfaceFormPadrao space-y-6">
    <div id="_gestor-interface-config-dados">#form-page#</div>
    <input id="_gestor-atualizar" name="_gestor-atualizar" type="hidden" value="1">
    <div data-c2f-form-erros class="hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
    <!-- botao-editar < --><div class="flex justify-center border-t border-slate-200 pt-4">
    	<button id="_gestor-interface-edit-button" type="submit" data-c2f-dica="#form-button-title#" class="c2fc-botao c2fc-botao-sucesso">#form-button-value#</button>
    </div><!-- botao-editar > -->
</form>
