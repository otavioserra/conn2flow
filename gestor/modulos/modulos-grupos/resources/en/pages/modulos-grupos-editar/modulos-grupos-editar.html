<div class="field">
    <label>#form-name-label#</label>
    <input type="text" name="nome" placeholder="#form-name-placeholder#" value="#nome#" />
</div>
<div class="two fields">
    <div class="field">
        <label>@[[form-menu-label-label]]@</label>
        <input type="text" name="menu_label" placeholder="@[[form-menu-label-placeholder]]@" value="#menu_label#" />
    </div>
    <div class="field">
        <label>@[[form-ordem-menu-label]]@</label>
        <input type="number" name="ordemMenu" placeholder="@[[form-ordem-menu-placeholder]]@" value="#ordemMenu#" />
    </div>
</div>
<div class="field">
    <label>@[[form-host-label]]@</label>
    <div class="ui toggle checkbox">
        <input type="checkbox" name="host" data-checked="#checked#">
        <label>&nbsp;</label>
    </div>
</div>
