<section data-id="1" data-title="formulario" class="space-y-5">
<div class="flex flex-col gap-2">
    <label class="text-sm font-medium text-slate-700">#form-name-label#</label>
    <input class="w-full rounded-lg border border-slate-300 px-3 py-2" type="text" name="nome" placeholder="#form-name-placeholder#" />
</div>
<div class="grid gap-4 sm:grid-cols-2">
    <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-slate-700">@[[form-menu-label-label]]@</label>
        <input class="w-full rounded-lg border border-slate-300 px-3 py-2" type="text" name="menu_label" placeholder="@[[form-menu-label-placeholder]]@" value="#menu_label#" />
    </div>
    <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-slate-700">@[[form-ordem-menu-label]]@</label>
        <input class="w-full rounded-lg border border-slate-300 px-3 py-2" type="number" name="ordemMenu" placeholder="@[[form-ordem-menu-placeholder]]@" value="#ordemMenu#" />
    </div>
</div>
<div class="flex flex-col gap-2">
    <label class="text-sm font-medium text-slate-700">@[[form-host-label]]@</label>
    <div class="flex items-center gap-2">
        <input class="h-5 w-5 accent-blue-600" type="checkbox" name="host" aria-label="@[[form-host-label]]@" #checked#>

    </div>
</div></section>
