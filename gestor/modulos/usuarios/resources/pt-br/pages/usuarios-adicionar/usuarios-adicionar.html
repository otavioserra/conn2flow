<!-- req-224: página em Tailwind (layout-administrativo-tailwind), padrão da biblioteca de controles da
     req-219 (c2fc-campo); os selects vêm do interface com `data-c2f-select`. -->
<div class="space-y-6">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="nome">@[[form-name-user-label]]@</label>
            <input type="text" id="nome" name="nome" class="c2fc-campo-entrada" placeholder="@[[form-name-placeholder]]@" autocomplete="new-password">
        </div>
    </div>
    <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-xs font-semibold tracking-wide text-slate-500 uppercase">
                <tr>
                    <th class="px-4 py-2">@[[first-name]]@</th>
                    <th class="px-4 py-2">@[[middle-name]]@</th>
                    <th class="px-4 py-2">@[[last-name]]@</th>
                </tr>
            </thead>
            <tbody>
                <tr class="text-slate-800">
                    <td class="first-name px-4 py-2"></td>
                    <td class="middle-name px-4 py-2"></td>
                    <td class="last-name px-4 py-2"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="user-profile">@[[form-user-profile-label]]@</label>
            <span>#select-user-profile#</span>
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="usuario">@[[form-user-label]]@</label>
            <input type="text" id="usuario" name="usuario" class="c2fc-campo-entrada" placeholder="@[[form-user-placeholder]]@" autocomplete="new-password">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="email">@[[form-email-label]]@</label>
            <input type="email" id="email" name="email" class="c2fc-campo-entrada" placeholder="@[[form-email-placeholder]]@" autocomplete="new-password">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="email-2">@[[form-email-2-label]]@</label>
            <input type="email" id="email-2" name="email-2" class="c2fc-campo-entrada" placeholder="@[[form-email-2-placeholder]]@" autocomplete="new-password">
        </div>
    </div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2" id="senha-campos">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="senha">@[[form-password-label]]@</label>
            <input type="password" id="senha" name="senha" class="c2fc-campo-entrada" placeholder="@[[form-password-placeholder]]@" autocomplete="new-password">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="senha-2">@[[form-password-2-label]]@</label>
            <input type="password" id="senha-2" name="senha-2" class="c2fc-campo-entrada" placeholder="@[[form-password-2-placeholder]]@" autocomplete="new-password">
        </div>
    </div>
</div>
