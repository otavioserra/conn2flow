<!-- req-219: página em Tailwind (layout-administrativo-tailwind). Campos no padrão da biblioteca de
     controles (c2fc-campo); os selects vêm do interface com `data-c2f-select`. -->
<div class="space-y-6">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="pagina-nome">#form-name-label#</label>
            <input type="text" id="pagina-nome" name="pagina-nome" class="c2fc-campo-entrada" placeholder="#form-name-placeholder#">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="pagina-caminho">#form-path-label#</label>
            <input type="text" id="pagina-caminho" name="paginaCaminho" class="c2fc-campo-entrada" placeholder="#form-path-placeholder#">
        </div>
    </div>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="layout">#form-layout-label#</label>
            <span>#select-layout#</span>
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="framework-css">#form-framework-css-label#</label>
            <span>#select-framework-css#</span>
        </div>
    </div>
    #layout-profile-mapping#
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="type">#form-type-label#</label>
            <span>#select-type#</span>
        </div>
        <!-- permissao-pagina < -->
        <div class="c2fc-campo">
            <span class="c2fc-campo-rotulo">#form-permission-label#</span>
            <label class="c2fc-chave mt-2">
            <input type="checkbox" name="sem_permissao" >
            <span class="c2fc-chave-trilho" aria-hidden="true"></span>
        </label>
        </div><!-- permissao-pagina > -->
    </div>
    <!-- agendamento-datas < -->
    <h4 class="border-b border-slate-200 pb-2 text-base font-semibold text-slate-900">Scheduling and dates</h4>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="data_publicacao_inicio">Publish from</label>
            <input type="datetime-local" id="data_publicacao_inicio" name="data_publicacao_inicio" class="c2fc-campo-entrada">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="data_publicacao_fim">Unpublish at</label>
            <input type="datetime-local" id="data_publicacao_fim" name="data_publicacao_fim" class="c2fc-campo-entrada">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="data_criacao">Creation date</label>
            <input type="datetime-local" id="data_criacao" name="data_criacao" class="c2fc-campo-entrada">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="data_modificacao">Modification date</label>
            <input type="datetime-local" id="data_modificacao" name="data_modificacao" class="c2fc-campo-entrada">
        </div>
    </div>
    <!-- agendamento-datas > -->
    <div class="pagina-modulos-container hidden grid grid-cols-1 gap-4 md:grid-cols-3">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="module">#form-module-label#</label>
            <span>#select-module#</span>
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="pagina-opcao">#form-option-label#</label>
            <input type="text" id="pagina-opcao" name="pagina-opcao" class="c2fc-campo-entrada" placeholder="#form-option-placeholder#">
        </div>
        <div class="c2fc-campo">
            <span class="c2fc-campo-rotulo">#form-root-label#</span>
            <label class="c2fc-chave mt-2">
            <input type="checkbox" name="raiz" >
            <span class="c2fc-chave-trilho" aria-hidden="true"></span>
        </label>
        </div>
    </div>
    <div class="c2fc-campo">
        <span class="c2fc-campo-rotulo">#form-page-content-label#</span>
        #html-editor#
    </div>
</div>
