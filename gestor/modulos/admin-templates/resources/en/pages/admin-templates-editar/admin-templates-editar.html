<!-- req-219: página em Tailwind (layout-administrativo-tailwind), padrão da biblioteca de controles
     (c2fc-campo, c2fc-botao); os selects vêm do interface com `data-c2f-select`. -->
<div class="space-y-6">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="template-nome">#form-name-label#</label>
            <input type="text" id="template-nome" name="template-nome" class="c2fc-campo-entrada" placeholder="#form-name-placeholder#" value="#template-nome#">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="target">#form-target-label#</label>
            <span>#select-target#</span>
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="framework-css">#form-framework-css-label#</label>
            <span>#select-framework-css#</span>
        </div>
    </div>
    <div class="c2fc-campo">
        <span class="c2fc-campo-rotulo">#form-thumbnail-label#</span>
        <span>#imagepick-thumbnail#</span>
    </div>
    <div class="c2fc-campo">
        <span class="c2fc-campo-rotulo">Linked Publisher</span>
        <div>
            <!-- publisher-has-link < -->
            <div class="flex flex-wrap items-center gap-3">
                <span class="flex items-center gap-2 text-base font-semibold text-slate-900"><i data-lucide="megaphone" class="size-5"></i>#publisher-name#</span>
                <a class="c2fc-botao c2fc-botao-pequeno" href="@[[pagina#url-raiz]]@publisher/editar/#publisher-id#" data-c2f-dica="Click to edit the publisher" data-c2f-dica-pos="top left">
                    <i data-lucide="pencil" class="size-4"></i>
                    Edit Publisher
                </a>
            </div><!-- publisher-has-link > -->
            <!-- publisher-no-link < -->
            <div class="flex items-start gap-3 rounded-lg border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-800">
                <i data-lucide="info" class="mt-0.5 size-5 shrink-0"></i>
                <div class="space-y-2">
                    <p class="font-semibold">No Linked Publisher</p>
                    <p>This record is not linked to any publisher.</p>
                    <a class="c2fc-botao c2fc-botao-primario c2fc-botao-pequeno" href="@[[pagina#url-raiz]]@publisher/adicionar">
                        <i data-lucide="plus" class="size-4"></i>
                        Create New Publisher
                    </a>
                </div>
            </div>
            <!-- publisher-no-link > -->
        </div>
    </div>
    <div class="c2fc-campo">
        <span class="c2fc-campo-rotulo">#form-template-content-label#</span>
        #html-editor#
    </div>
</div>
