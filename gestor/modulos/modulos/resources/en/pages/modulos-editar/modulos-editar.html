<!-- req-224: página em Tailwind (layout-administrativo-tailwind), padrão da biblioteca de controles da
     req-219 (c2fc-campo); os selects vêm do interface com `data-c2f-select`. -->
<div class="space-y-6">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="nome">#form-name-label#</label>
            <input type="text" id="nome" name="nome" class="c2fc-campo-entrada" placeholder="#form-name-placeholder#" value="#nome#">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="titulo">#form-title-label#</label>
            <input type="text" id="titulo" name="titulo" class="c2fc-campo-entrada" placeholder="#form-title-placeholder#" value="#titulo#">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="grup">#form-grup-label#</label>
            <span>#select-grup#</span>
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="plugin">#form-plugin-label#</label>
            <span>#select-plugin#</span>
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="menu">#form-menu-label#</label>
            <span>#select-menu#</span>
        </div>
        <div class="c2fc-campo">
            <span class="c2fc-campo-rotulo">@[[form-host-label]]@</span>
            <label class="c2fc-chave mt-1"><input type="checkbox" name="host" data-checked="#checked#"><span class="c2fc-chave-trilho" aria-hidden="true"></span></label>
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="icone">#form-icon-label#</label>
            <input type="text" id="icone" name="icone" class="c2fc-campo-entrada" placeholder="#form-icon-placeholder#" value="#icone#">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="icone_tailwind">#form-icon-tailwind-label#</label>
            <input type="text" id="icone_tailwind" name="icone_tailwind" class="c2fc-campo-entrada" placeholder="#form-icon-tailwind-placeholder#" value="#icone_tailwind#">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="icone2">#form-icon-2-label#</label>
            <input type="text" id="icone2" name="icone2" class="c2fc-campo-entrada" placeholder="#form-icon-2-placeholder#" value="#icone2#">
        </div>
        <div class="c2fc-campo">
            <label class="c2fc-campo-rotulo" for="icone2_tailwind">#form-icon-2-tailwind-label#</label>
            <input type="text" id="icone2_tailwind" name="icone2_tailwind" class="c2fc-campo-entrada" placeholder="#form-icon-2-tailwind-placeholder#" value="#icone2_tailwind#">
        </div>
    </div>
</div>
