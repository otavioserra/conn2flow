<section class="mx-auto max-w-3xl space-y-6 p-4">
    <h1 class="flex items-center gap-2 text-2xl font-bold text-slate-900"><i data-lucide="bot"
            class="size-5"></i>@[[ui-add-title]]@</h1>
    <div id="admin-ia-mensagens" class="hidden" aria-hidden="true" data-confirm-delete="@[[ui-confirm-delete]]@"
        data-error-communication="@[[ui-error-communication]]@" data-error-history="@[[ui-error-history]]@"
        data-error-test-communication="@[[ui-error-test-communication]]@" data-error-generic="@[[ui-error-generic]]@"
        data-history-empty="@[[ui-history-empty]]@"></div>
    <form id="form-servidor-ia" class="space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="space-y-1">
            <label class="c2fc-campo-rotulo" for="admin-ia-nome">@[[ui-name]]@</label>
            <input id="admin-ia-nome" class="c2fc-campo-entrada w-full" type="text" name="nome"
                placeholder="@[[ui-name-placeholder]]@" required>
        </div>
        <div class="space-y-1">
            <label class="c2fc-campo-rotulo" for="admin-ia-tipo">@[[ui-type]]@</label>
            <select id="admin-ia-tipo" class="c2fc-campo-selecao w-full" name="tipo" data-c2f-select="1" required>
                <option value="gemini" selected>@[[ui-provider-gemini]]@</option>
                <option value="anthropic">@[[ui-provider-anthropic]]@</option>
                <option value="openai">@[[ui-provider-openai]]@</option>
                <option value="openai-compativel">@[[ui-provider-compatible]]@</option>
            </select>
        </div>
        <label class="c2fc-chave">
            <input type="checkbox" name="padrao">
            <span class="c2fc-chave-trilho"></span>
            <span class="c2fc-chave-rotulo">@[[ui-default]]@</span>
        </label>
        <div class="space-y-1">
            <label class="c2fc-campo-rotulo" for="admin-ia-chave">@[[ui-api-key]]@</label>
            <input id="admin-ia-chave" class="c2fc-campo-entrada w-full" type="password" name="chave_api"
                placeholder="@[[ui-api-key-placeholder]]@" required>
            <p class="text-sm text-slate-600">@[[ui-api-key-hint]]@</p>
        </div>
        <div id="admin-ia-provedores" class="hidden" aria-hidden="true" data-provedores="[[provedores-json]]"></div>
        <div class="space-y-1">
            <label class="c2fc-campo-rotulo" for="admin-ia-url-base">@[[ui-base-url]]@</label>
            <input id="admin-ia-url-base" class="c2fc-campo-entrada w-full" type="text" name="url_base" maxlength="255"
                autocomplete="off" spellcheck="false">
            <p class="text-sm text-slate-600">@[[ui-base-url-hint]]@</p>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div class="space-y-1">
                <label class="c2fc-campo-rotulo" for="admin-ia-modelo">@[[ui-model]]@</label>
                <input id="admin-ia-modelo" class="c2fc-campo-entrada w-full" type="text" name="modelo" maxlength="150"
                    autocomplete="off" spellcheck="false">
                <p class="text-sm text-slate-600">@[[ui-model-hint]]@</p>
            </div>
            <div class="space-y-1">
                <label class="c2fc-campo-rotulo" for="admin-ia-modelo-imagem">@[[ui-image-model]]@</label>
                <input id="admin-ia-modelo-imagem" class="c2fc-campo-entrada w-full" type="text" name="modelo_imagem"
                    maxlength="150" autocomplete="off" spellcheck="false">
                <p class="text-sm text-slate-600">@[[ui-image-model-hint]]@</p>
            </div>
        </div>
        <label class="c2fc-chave">
            <input type="checkbox" name="testar_conexao" checked>
            <span class="c2fc-chave-trilho"></span>
            <span class="c2fc-chave-rotulo">@[[ui-test-after-save]]@</span>
        </label>
        <div class="flex flex-wrap gap-3">
            <button type="submit"
                class="c2fc-botao js-submit inline-flex items-center gap-2 rounded bg-sky-700 px-4 py-2 text-white"><i
                    data-lucide="save" class="size-4"></i>@[[ui-save]]@</button>
            <a href="@[[pagina#url-raiz]]@admin-ia/listar/"
                class="c2fc-botao inline-flex items-center gap-2 rounded border border-slate-300 px-4 py-2"><i
                    data-lucide="arrow-left" class="size-4"></i>@[[ui-back]]@</a>
        </div>
    </form>
</section>
