<!-- conteiner < -->
<div id="seg-equipe" class="space-y-6">
    <div id="equipe-msg" class="hidden rounded-lg border px-4 py-3 text-sm"></div>
    <div class="@[[classe-cartao]]@">
        <h3 class="@[[classe-titulo]]@">@[[team-title]]@</h3>
        <p class="@[[classe-ajuda]]@">@[[team-help]]@</p>
        <p id="equipe-assentos" class="mt-3 text-sm font-semibold text-slate-800">#assentos#</p>
        <!-- cheia < -->
        <p class="@[[classe-ajuda]]@ mt-2">@[[team-quota-full]]@</p><!-- cheia > -->
        <!-- novo < -->
        <button type="button" class="@[[classe-botao-ok]]@ mt-4" id="btn-equipe-novo">@[[team-add]]@</button><!-- novo > -->
    </div>
    <div id="equipe-form" class="@[[classe-cartao]]@ hidden">
        <h4 class="@[[classe-titulo]]@">@[[team-add]]@</h4>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div>
                <label class="@[[classe-rotulo]]@" for="equipe-nome">@[[team-name-label]]@</label>
                <input type="text" id="equipe-nome" maxlength="255" autocomplete="off" class="@[[classe-campo]]@">
            </div>
            <div>
                <label class="@[[classe-rotulo]]@" for="equipe-email">@[[team-email-label]]@</label>
                <input type="email" id="equipe-email" maxlength="255" autocomplete="off" class="@[[classe-campo]]@">
            </div>
            <div>
                <label class="@[[classe-rotulo]]@" for="equipe-senha">@[[team-password-label]]@</label>
                <input type="password" id="equipe-senha" minlength="12" autocomplete="new-password" class="@[[classe-campo]]@">
                <p class="@[[classe-ajuda]]@ mt-1">@[[team-password-help]]@</p>
            </div>
        </div>
        <div class="mt-4 flex flex-wrap gap-2">
            <button type="button" class="@[[classe-botao-ok]]@" id="btn-equipe-criar">@[[team-confirm]]@</button>
            <button type="button" class="@[[classe-botao]]@" id="btn-equipe-cancelar">@[[team-cancel]]@</button>
        </div>
    </div>
    <!-- vazio < -->
    <p class="@[[classe-ajuda]]@">@[[team-empty]]@</p><!-- vazio > -->
    <!-- tabela < -->
    <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table id="equipe-lista" class="w-full min-w-max text-left text-sm">
            <thead class="bg-slate-50 text-xs font-semibold tracking-wide text-slate-500 uppercase">
                <tr>
                    <th class="border-b border-slate-200 px-4 py-2">@[[team-col-name]]@</th>
                    <th class="border-b border-slate-200 px-4 py-2">@[[team-col-email]]@</th>
                    <th class="border-b border-slate-200 px-4 py-2">@[[team-col-status]]@</th>
                    <th class="border-b border-slate-200 px-4 py-2">@[[team-col-actions]]@</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <!-- linha -->
            </tbody>
        </table>
    </div><!-- tabela > -->
</div><!-- conteiner > -->
<!-- linha < -->
<tr>
    <td class="px-4 py-2 font-medium text-slate-800">#nome#</td>
    <td class="px-4 py-2 text-slate-600">#email#</td>
    <td class="px-4 py-2"><span class="@[[classe-etiqueta]]@ #cor-status#">#status#</span></td>
    <td class="px-4 py-2">
        <button type="button" class="@[[classe-botao-mini]]@ btn-equipe-status" data-id="#id#"
            data-status="#proximo-status#">#acao#</button>
    </td>
</tr><!-- linha > -->
