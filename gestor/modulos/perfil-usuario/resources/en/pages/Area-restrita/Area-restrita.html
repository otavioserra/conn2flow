<div class="mx-auto w-full max-w-md">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <div class="mb-4 flex justify-center">
            <span class="flex size-12 items-center justify-center rounded-full bg-sky-50 text-2xl"
                aria-hidden="true">&#128274;</span>
        </div>
        <h1 class="mb-6 text-center text-2xl font-semibold text-slate-900">@[[pagina#titulo]]@</h1>
        <div class="rounded-lg border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-900">
            <p class="font-semibold">@[[restrict-area-info-title]]@</p>
            <p class="mt-1">@[[restrict-area-info]]@</p>
        </div>
        <form id="_gestor-restrict-area" action="#form-action#" method="post"
            name="_gestor-restrict-area" data-c2f-form="tailwind" class="restrictArea mt-4 space-y-4">
            <div>
                <div class="c2fc-campo"><label class="c2fc-campo-rotulo" for="c2f-senha">@[[form-password-label]]@</label>
<input class="c2fc-campo-entrada" type="password" id="c2f-senha" name="senha" placeholder="@[[form-password-placeholder]]@" autocomplete="current-password"></div>
            </div>
            <div class="hidden rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800" data-c2f-form-erros></div>
            <input id="_gestor-restrict-area-atualizar" name="_gestor-restrict-area-atualizar"
                type="hidden" value="1">
            <input id="_gestor-restrict-area-querystring" name="_gestor-restrict-area-querystring"
                type="hidden" value="#form-querystring#">
            <button id="_gestor-restrict-area-button" type="submit" data-c2f-dica="#form-button-title#"
                class="c2fc-botao c2fc-botao-primario">#form-button-value#</button>
        </form>
    </div>
</div>
