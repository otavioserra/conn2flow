<div id="c2f-toolbar-menu" class="relative group flex items-stretch">
    <button type="button"
        class="flex items-center gap-1 px-3 hover:bg-slate-700 transition-colors whitespace-nowrap">
        #label#
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </button>
    <ul
        class="absolute left-0 top-full w-64 bg-white border border-slate-200 rounded-b-md shadow-lg py-1 hidden group-hover:block z-10 max-h-96 overflow-auto">
        <li class="px-2 pt-2 pb-1">
            <input id="c2f-modules-filter" type="text" autocomplete="off" placeholder="#filter-placeholder#"
                class="w-full px-2 py-1 text-sm border border-slate-200 rounded text-slate-700 focus:outline-none focus:border-slate-400">
        </li>
        #items#
    </ul>
</div>
