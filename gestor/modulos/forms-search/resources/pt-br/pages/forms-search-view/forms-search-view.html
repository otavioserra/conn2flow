<div class="req222-page space-y-4">
<div class="max-w-full overflow-x-auto"><table class="w-full text-sm text-left border-collapse my-4 definition table">
    <thead>
        <tr>
            <th class="border-b border-slate-200 px-3 py-2 align-top"></th>
            <th class="border-b border-slate-200 px-3 py-2 align-top"><i data-lucide="info" class="size-4 shrink-0 icon "></i> Informações Básicas</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="border-b border-slate-200 px-3 py-2 align-top">ID do Formulário</td>
            <td class="border-b border-slate-200 px-3 py-2 align-top">
                <div class="c2fc-rotulo basic label">#id#</div>
            </td>
        </tr>
        <tr>
            <td class="border-b border-slate-200 px-3 py-2 align-top two wide">Nome</td>
            <td class="border-b border-slate-200 px-3 py-2 align-top">#name#</td>
        </tr>
        <tr>
            <td class="border-b border-slate-200 px-3 py-2 align-top">Descrição</td>
            <td class="border-b border-slate-200 px-3 py-2 align-top">#description#</td>
        </tr>
        <tr>
            <td class="border-b border-slate-200 px-3 py-2 align-top">Módulo</td>
            <td class="border-b border-slate-200 px-3 py-2 align-top">#module#</td>
        </tr>
    </tbody>
</table></div>

<div class="max-w-full overflow-x-auto"><table class="w-full text-sm text-left border-collapse my-4 table">
    <thead>
        <tr>
            <th class="border-b border-slate-200 px-3 py-2 align-top"><i data-lucide="code" class="size-4 shrink-0 icon "></i> Esquema dos Campos</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="border-b border-slate-200 px-3 py-2 align-top">

                <div class="fields-schema-component">
                    <div class="c2fc-abas c2fc-abas-lista c2fc-anexa top attached tabular menu menuForms">
                        <a class="c2fc-aba active item" data-tab="data"
                            data-c2f-dica="Clique para abrir os dados do esquema dos campos em formato JSON"
                            data-position="top left" data-inverted="">Dados</a>
                        <a class="c2fc-aba item" data-tab="info"
                            data-c2f-dica="Clique para abrir as informações das opções disponíveis do formulário em formato JSON"
                            data-position="top left" data-inverted="">Informações</a>
                    </div>
                    <div class="c2fc-painel-aba min-w-0 bottom attached tab segment containerForms" data-tab="data">
                        <textarea class="c2fc-campo-entrada codemirror-json">#fields_schema#</textarea>
                    </div>
                    <div class="c2fc-painel-aba min-w-0 bottom attached tab segment containerForms" data-tab="info">
                        #forms-search-info-definition#
                    </div>
                </div>
            </td>
        </tr>
    </tbody>
</table></div>
</div>
