<div class="req222-page space-y-4">
<template id="field-row-template"><table><tbody>
  <tr>
    <td><i data-lucide="grip-vertical" class="c2fc-icone forms-search-field-handle"></i></td>
    <td><input type="text" class="c2fc-campo-entrada forms-search-field-label"></td>
    <td><input type="text" class="c2fc-campo-entrada forms-search-field-name"></td>
    <td><select class="c2fc-campo-entrada forms-search-field-type dropdown"><option value="text">@[[field-type-text]]@</option>
<option value="email">@[[field-type-email]]@</option>
<option value="tel">@[[field-type-tel]]@</option>
<option value="number">@[[field-type-number]]@</option>
<option value="password">@[[field-type-password]]@</option>
<option value="date">@[[field-type-date]]@</option>
<option value="url">@[[field-type-url]]@</option>
<option value="hidden">@[[field-type-hidden]]@</option>
<option value="textarea">@[[field-type-textarea]]@</option>
<option value="select">@[[field-type-select]]@</option>
<option value="radio">@[[field-type-radio]]@</option>
<option value="checkbox">@[[field-type-checkbox]]@</option></select></td>
    <td><input type="text" class="c2fc-campo-entrada forms-search-field-placeholder"></td>
    <td><textarea rows="2" class="c2fc-campo-entrada forms-search-field-options"></textarea></td>
    <td><label class="c2fc-chave checkbox"><input type="checkbox" class="forms-search-field-required"><span class="c2fc-chave-trilho" aria-hidden="true"></span></label></td>
    <td><button type="button" class="c2fc-botao c2fc-botao-perigo c2fc-botao-icone forms-search-field-remove" aria-label="@[[field-remove-label]]@"><i data-lucide="trash-2" class="c2fc-icone"></i></button></td>
  </tr>
</tbody></table></template>

<input type="hidden" name="fields_schema">

<div class="forms-search-main-tabs">
<div class="flex flex-wrap gap-2 border-b border-slate-200 py-2 top attached tabular menu menuForms">
    <a class="c2fc-aba active item" data-tab="forms-search-general"><i data-lucide="settings" class="size-4 shrink-0 icon "></i> Geral</a>
    <a class="c2fc-aba item" data-tab="forms-search-fields"><i data-lucide="list" class="size-4 shrink-0 icon "></i> Campos Extras</a>
</div>

<div class="rounded-b-xl border border-slate-200 bg-white p-4 min-w-0 bottom attached active tab segment" data-tab="forms-search-general">
    <div class="c2fc-campo min-w-0 mb-4 field">
        <label class="c2fc-campo-rotulo">Nome</label>
        <input class="c2fc-campo-entrada" type="text" name="name" placeholder="Ex: Nome do Formulário" value="#name#">
    </div>
    <div class="c2fc-campo min-w-0 mb-4 field">
        <label class="c2fc-campo-rotulo">Descrição</label>
        <input class="c2fc-campo-entrada" type="text" name="description" placeholder="Ex: Descrição do Formulário" value="#description#">
    </div>
    <div class="c2fc-campo min-w-0 mb-4 field">
        <label class="c2fc-campo-rotulo">#form-module-label#</label>
        <span>#select-module#</span>
    </div>
    <div class="c2fc-campo min-w-0 mb-4 field">
        <label class="c2fc-campo-rotulo">Ação</label>
        <input class="c2fc-campo-entrada" type="text" id="form_action" placeholder="pages-index-search/">
    </div>
</div>

<div class="rounded-b-xl border border-slate-200 bg-white p-4 min-w-0 bottom attached tab segment" data-tab="forms-search-fields">
    <div class="rounded-lg border border-sky-200 bg-sky-50 text-sky-800 p-4 my-4 info message">O campo de busca <code>search</code> é obrigatório e incluído automaticamente. Cadastre aqui apenas filtros adicionais.</div>
    <button type="button" class="c2fc-botao c2fc-botao-primario primary button" id="btn-add-form-field"><i data-lucide="plus" class="size-4 shrink-0 icon "></i> Campo</button>
    <div class="max-w-full overflow-x-auto"><table class="w-full text-sm text-left border-collapse my-4 celled compact table" id="forms-search-fields-table">
        <thead>
            <tr>
                <th class="border-b border-slate-200 px-3 py-2 align-top" style="width:40px;"></th><th class="border-b border-slate-200 px-3 py-2 align-top">Rótulo</th><th class="border-b border-slate-200 px-3 py-2 align-top">Nome</th><th class="border-b border-slate-200 px-3 py-2 align-top">Tipo</th><th class="border-b border-slate-200 px-3 py-2 align-top">Placeholder</th><th class="border-b border-slate-200 px-3 py-2 align-top">Opções</th><th class="border-b border-slate-200 px-3 py-2 align-top" style="width:90px;">Obrigatório</th><th class="border-b border-slate-200 px-3 py-2 align-top" style="width:60px;"></th>
            </tr>
        </thead>
        <tbody></tbody>
    </table></div>
</div>
</div>

<h4 class="text-lg font-semibold text-slate-800 my-4 dividing header">Conteúdo do Formulário</h4>

<div class="c2fc-campo min-w-0 mb-4 field">
    <label class="c2fc-campo-rotulo">Modelo</label>
    <select data-c2f-select id="template_id" class="c2fc-campo-entrada search clearable dropdown templateDropdown" name="template_id">
        <option value="">#template_placeholder_option#</option>
        #template_id_options#
    </select>
</div>

<div class="forms-search-content-tabs">
<div class="flex flex-wrap gap-2 border-b border-slate-200 py-2 top attached tabular menu menuConteudoForm">
    <a class="c2fc-aba active item" data-tab="forms-search-preview"><i data-lucide="eye" class="size-4 shrink-0 icon "></i> Pré-Visualização</a>
    <a class="c2fc-aba item" data-tab="forms-search-editor"><i data-lucide="code" class="size-4 shrink-0 icon "></i> Editor HTML</a>
    <a class="c2fc-aba item" data-tab="forms-search-widget"><i data-lucide="blocks" class="size-4 shrink-0 icon "></i> Código do Widget</a>
</div>
<div class="rounded-b-xl border border-slate-200 bg-white p-4 min-w-0 bottom attached active tab segment" data-tab="forms-search-preview">
    <div style="position:relative;">
        <iframe id="iframe-forms-search-preview" style="width:100%;height:700px;border:1px solid #ccc;"></iframe>
        <div class="c2fc-cobertura ui dimmer forms-search-preview-dimmer"><div class="c2fc-giro loader"></div></div>
    </div>
</div>
<div class="rounded-b-xl border border-slate-200 bg-white p-4 min-w-0 bottom attached tab segment" data-tab="forms-search-editor">
    #html-editor#
</div>
<div class="rounded-b-xl border border-slate-200 bg-white p-4 min-w-0 bottom attached tab segment" data-tab="forms-search-widget">
    <div class="c2fc-campo min-w-0 mb-4 field">
        <label class="c2fc-campo-rotulo">Variável do Widget</label>
        <div class="flex items-center gap-2 min-w-0 action input">
            <input class="c2fc-campo-entrada" type="text" id="forms-search-widget-val" readonly>
            <button type="button" id="btn-copy-forms-search-widget-val" class="c2fc-botao c2fc-botao-primario teal button"><i data-lucide="copy" class="size-4 shrink-0 icon "></i> Copiar</button>
        </div>
    </div>
    <h4 class="text-lg font-semibold text-slate-800 my-4 header">Código HTML</h4>
    <div style="border:1px solid #ccc;"><textarea class="c2fc-campo-entrada" id="forms-search-widget-code"></textarea></div>
</div>
</div>

</div>
