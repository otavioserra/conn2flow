<div class="space-y-4" data-admin-plugins-source data-plugin-source-initial="#origem_tipo#">
    <div class="c2fc-campo space-y-1">
        <label class="c2fc-campo-rotulo">@[[form-name-label]]@</label>
        <input class="c2fc-campo-entrada w-full rounded border border-slate-300 px-3 py-2" type="text" name="nome"
            placeholder="@[[form-name-placeholder]]@" value="#nome#">
    </div>

    <input type="hidden" name="origem_selecionada" id="origem_selecionada" value="#origem_tipo#">

    <div class="space-y-2">
        <p class="text-sm font-medium text-slate-700">@[[ui-plugin-source]]@</p>
        <div class="flex flex-wrap gap-2 border-b border-slate-200" role="tablist" aria-label="@[[ui-plugin-source]]@">
            <button class="c2fc-aba #arquivo_active#" type="button" role="tab" aria-selected="#arquivo_aria#"
                data-plugin-source-tab="arquivo">@[[ui-source-zip]]@</button>
            <button class="c2fc-aba #publico_active#" type="button" role="tab" aria-selected="#publico_aria#"
                data-plugin-source-tab="publico">@[[ui-source-public]]@</button>
            <button class="c2fc-aba #privado_active#" type="button" role="tab" aria-selected="#privado_aria#"
                data-plugin-source-tab="privado">@[[ui-source-private]]@</button>
        </div>

        <section class="#arquivo_segment# space-y-4 py-3" role="tabpanel" data-plugin-source-panel="arquivo"><label
                class="block space-y-1 text-sm font-medium text-slate-700"><span>@[[ui-file-zip-label]]@</span><input
                    class="block w-full rounded border border-slate-300 px-3 py-2 text-sm file:mr-3 file:rounded file:border-0 file:bg-slate-100 file:px-3 file:py-2"
                    type="file" name="arquivo_zip" accept=".zip"><span
                    class="text-xs font-normal text-slate-600">@[[ui-file-zip-help]]@</span></label></section>
        <section class="#publico_segment# space-y-4 py-3" role="tabpanel" data-plugin-source-panel="publico"><label
                class="block space-y-1 text-sm font-medium text-slate-700"><span>@[[ui-repo-url-label]]@</span><input
                    class="c2fc-campo-entrada w-full rounded border border-slate-300 px-3 py-2" type="url" name="repo_publico_url"
                    placeholder="https://github.com/usuario/repo" value="#repo_publico_url#"><span
                    class="text-xs font-normal text-slate-600">@[[ui-repo-latest-help]]@</span></label></section>
        <section class="#privado_segment# space-y-4 py-3" role="tabpanel" data-plugin-source-panel="privado"><label
                class="block space-y-1 text-sm font-medium text-slate-700"><span>@[[ui-repo-url-label]]@</span><input
                    class="c2fc-campo-entrada w-full rounded border border-slate-300 px-3 py-2" type="url" name="repo_privado_url"
                    placeholder="https://github.com/usuario/repo" value="#repo_privado_url#"></label><label
                class="block space-y-1 text-sm font-medium text-slate-700"><span>@[[ui-auth-token-label]]@</span><input
                    class="c2fc-campo-entrada w-full rounded border border-slate-300 px-3 py-2" type="password" name="repo_privado_token"
                    placeholder="@[[ui-auth-token-placeholder]]@" value="#repo_privado_token#"></label>
            <p class="text-xs text-slate-600">@[[ui-private-repo-help]]@</p>
        </section>
    </div>
