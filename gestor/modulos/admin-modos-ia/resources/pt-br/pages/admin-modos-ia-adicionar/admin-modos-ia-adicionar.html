<div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-6">
<div class="c2fc-campo">
    <label class="c2fc-campo-rotulo">#form-name-label#</label>
    <input class="c2fc-campo-entrada" type="text" name="nome" placeholder="#form-name-placeholder#">
</div>
<div class="c2fc-campo">
    <label class="c2fc-campo-rotulo">#form-target-label#</label>
    <span>#select-target#</span>
</div>
<label class="c2fc-chave mt-6">
    <input type="checkbox" name="padrao">
    <span class="c2fc-chave-trilho"></span>
    <span class="c2fc-chave-rotulo">#form-default-label#</span>
</label>
<div class="c2fc-campo">
    <label class="c2fc-campo-rotulo">#form-mode-label#</label>
    <textarea name="prompt" rows="10" placeholder="#form-mode-placeholder#"
        class="codemirror c2fc-campo-entrada"></textarea>
</div>
</div>
