<!-- req-219: variante Tailwind de uma linha layout × perfil (selects do interface com `data-c2f-select`). -->
<div class="layout-profile-row grid grid-cols-1 items-end gap-4 md:grid-cols-[1fr_1fr_auto]">
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#mapping-layout-label#</label>
        <span>#select-layout-profile-layout-#row-index##</span>
    </div>
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#mapping-profile-label#</label>
        <span>#select-layout-profile-profile-#row-index##</span>
    </div>
    <div>
        <button type="button" class="layout-profile-remove c2fc-botao c2fc-botao-perigo c2fc-botao-pequeno">#mapping-remove-label#</button>
    </div>
</div>
