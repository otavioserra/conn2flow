<div class="space-y-4 min-w-0 publisher-pages-form">
<div class="c2fc-campo">
    <label class="c2fc-campo-rotulo">#form-publisher-label#</label>
    <span>#select-publisher#</span>
</div>

<!-- publisher-options < -->
<div class="mt-3 mb-2 flex flex-wrap items-center gap-2">
<a class="c2fc-botao c2fc-botao-primario" href="@[[pagina#url-raiz]]@publisher/editar/#publisher-id#"
    data-c2f-dica="Clique para editar o publicador" data-c2f-dica-pos="top left">
    <i data-lucide="pencil" class="size-4 shrink-0"></i>
    Editar Publicador
</a>
</div><!-- publisher-options > -->

<h4 class="mt-6 mb-3 border-b border-slate-200 pb-2 font-semibold publisher-fields-header">
    <i data-lucide="image" class="size-4 shrink-0"></i>
    Campos da Página
</h4>

<div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-name-label#</label>
        <input type="text" name="pagina-nome" placeholder="#form-name-placeholder#" class="c2fc-campo-entrada">
    </div>
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-path-label#</label>
        <input type="text" name="paginaCaminho" placeholder="#form-path-placeholder#" class="c2fc-campo-entrada">
    </div>
</div>
<div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-layout-label#</label>
        <span>#select-layout#</span>
    </div>
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-framework-css-label#</label>
        <span>#select-framework-css#</span>
    </div>
</div>
<div class="my-4 space-y-3">#layout-profile-mapping#</div>
<div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-type-label#</label>
        <span>#select-type#</span>
    </div>
    <!-- permissao-pagina < -->
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-permission-label#</label>
        <label class="c2fc-chave checkbox">
            <input type="checkbox" name="sem_permissao"><span class="c2fc-chave-trilho"></span>
            <span class="c2fc-chave-rotulo">&nbsp;</span>
        </label>
    </div><!-- permissao-pagina > -->
</div>
<!-- agendamento-datas < -->
<h4 class="mt-6 mb-3 border-b border-slate-200 pb-2 font-semibold">Agendamento e datas</h4>
<div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">Publicar a partir de</label>
        <input type="datetime-local" name="data_publicacao_inicio" class="c2fc-campo-entrada">
    </div>
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">Despublicar em</label>
        <input type="datetime-local" name="data_publicacao_fim" class="c2fc-campo-entrada">
    </div>
</div>
<div class="grid grid-cols-1 gap-4 md:grid-cols-2">
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">Data de criação</label>
        <input type="datetime-local" name="data_criacao" class="c2fc-campo-entrada">
    </div>
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">Data de modificação</label>
        <input type="datetime-local" name="data_modificacao" class="c2fc-campo-entrada">
    </div>
</div>
<!-- agendamento-datas > -->
<div class="grid grid-cols-1 gap-4 md:grid-cols-3 hidden pagina-modulos-container">
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-module-label#</label>
        <span>#select-module#</span>
    </div>
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-option-label#</label>
        <input type="text" name="pagina-opcao" placeholder="#form-option-placeholder#" class="c2fc-campo-entrada">
    </div>
    <div class="c2fc-campo">
        <label class="c2fc-campo-rotulo">#form-root-label#</label>
        <label class="c2fc-chave checkbox">
            <input type="checkbox" name="raiz"><span class="c2fc-chave-trilho"></span>
            <span class="c2fc-chave-rotulo">&nbsp;</span>
        </label>
    </div>
</div>

<!-- publisher-fields-container < -->
<div class="publisher-fields-container">

    <h4 class="mt-6 mb-3 border-b border-slate-200 pb-2 font-semibold publisher-fields-header">
        <i data-lucide="file-text" class="size-4 shrink-0"></i>
        Campos do Publicador
    </h4>

    <!-- publisher-fields -->

    <input type="hidden" name="publisher_fields_schema" value='#publisher-fields-schema#'>

    <div class="my-4 border-t border-slate-200"></div>
</div><!-- publisher-fields-container > -->

<div class="mt-6 min-w-0">
    <span class="c2fc-campo-rotulo mb-2 block">#form-page-content-label#</span>
    #html-editor#
</div>
</div>
