<div class="mb-4">
    <label class="mb-1 block text-sm font-medium">#form-name-label#</label>
    <input class="w-full rounded border border-slate-300 px-3 py-2" type="text" name="nome"
        placeholder="#form-name-placeholder#" value="#nome#">
</div>
<div class="mb-4">
    <label class="mb-1 block text-sm font-medium">#form-module-label#</label>
    <span>#select-module#</span>
</div>
<div class="mb-4">
    <label class="mb-1 block text-sm font-medium">@[[form-plugin-label]]@</label>
    <span>#select-plugin#</span>
</div>
<!-- categoria-pai < -->
<div class="mb-4">
    <label class="mb-1 block text-sm font-medium">#form-categories-parent-label#</label> #cont-categoria-pai#
</div><!-- categoria-pai > -->
<div class="mb-4">
    <label class="mb-1 block text-sm font-medium">#form-categories-child-label#</label>
    <a class="inline-flex items-center gap-2 rounded border border-amber-600 px-3 py-1"
        href="@[[pagina#url-raiz]]@admin-categorias/adicionar-filho/?id=#categoria-pai#"
        title="@[[category-child-placeholder]]@" data-id="adicionar-filho">
        <i data-lucide="circle-plus" class="size-4 shrink-0"></i> @[[category-child-label]]@ </a> #categorias-filho#
</div>
