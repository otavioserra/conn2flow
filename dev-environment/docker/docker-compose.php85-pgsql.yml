# Conn2Flow v3 PostgreSQL integration environment.
#
# Start the web/database profile:
#   docker compose -f docker-compose.php85-pgsql.yml up -d
#
# Run banco v2 PostgreSQL tests in an isolated container:
#   docker compose -f docker-compose.php85-pgsql.yml --profile tests run --rm banco-v2-tests
#
# This project intentionally does not share containers, volumes, ports or site
# files with the MySQL/2.9.x environment.

name: c2f-v3-pgsql

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.php85
    restart: unless-stopped
    ports:
      - "127.0.0.1:${C2F_PGSQL_APP_PORT:-8085}:80"
    volumes:
      - ../data/postgresql/sites:/var/www/sites:cached
      - ../..:/workspace:cached
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/sites/localhost/public_html
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${C2F_PGSQL_DATABASE:-conn2flow}
      DB_USERNAME: ${C2F_PGSQL_USERNAME:-conn2flow_user}
      DB_PASSWORD: ${C2F_PGSQL_PASSWORD:-conn2flow_pass}
      DB_SCHEMA: ${C2F_PGSQL_SCHEMA:-public}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(extension_loaded('pdo_pgsql') ? 0 : 1);\" && apache2ctl -t"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - c2f-pgsql

  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${C2F_PGSQL_DATABASE:-conn2flow}
      POSTGRES_USER: ${C2F_PGSQL_USERNAME:-conn2flow_user}
      POSTGRES_PASSWORD: ${C2F_PGSQL_PASSWORD:-conn2flow_pass}
      PGDATA: /var/lib/postgresql/18/docker
      TZ: UTC
    ports:
      - "127.0.0.1:${C2F_PGSQL_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ uses a major-version-specific PGDATA below this mount.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - c2f-pgsql

  banco-v2-tests:
    build:
      context: .
      dockerfile: Dockerfile.php85
    profiles: ["tests"]
    restart: "no"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >-
        php vendor/phpunit/phpunit/phpunit -c phpunit.xml
        tests/Unit/PHP/DatabaseDialectTest.php
        tests/Integration/BancoV2PostgreSqlTest.php
    working_dir: /workspace
    volumes:
      - ../..:/workspace:cached
    environment:
      CONN2FLOW_RUN_PGSQL_TESTS: "1"
      CONN2FLOW_DB_CONNECTION: pgsql
      CONN2FLOW_DB_HOST: postgres
      CONN2FLOW_DB_PORT: 5432
      CONN2FLOW_DB_DATABASE: ${C2F_PGSQL_DATABASE:-conn2flow}
      CONN2FLOW_DB_USERNAME: ${C2F_PGSQL_USERNAME:-conn2flow_user}
      CONN2FLOW_DB_PASSWORD: ${C2F_PGSQL_PASSWORD:-conn2flow_pass}
      CONN2FLOW_DB_SCHEMA: ${C2F_PGSQL_SCHEMA:-public}
      CONN2FLOW_DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - c2f-pgsql

  pgadmin:
    image: dpage/pgadmin4:9.17
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${C2F_PGADMIN_EMAIL:-admin@conn2flow.local}
      PGADMIN_DEFAULT_PASSWORD: ${C2F_PGADMIN_PASSWORD:-change-me-local}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "127.0.0.1:${C2F_PGADMIN_PORT:-8083}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - c2f-pgsql

volumes:
  postgres_data:
  pgadmin_data:

networks:
  c2f-pgsql:
    driver: bridge
