name: Release Gestor Instalador

on:
  push:
    tags:
      - 'instalador-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create instalador.zip + checksum
      run: |
        # Criar o arquivo ZIP com apenas o gestor-instalador
        cd gestor-instalador
        zip -r ../instalador.zip . \
          -x "*.git*" \
          -x "*.DS_Store*" \
          -x "*.log*" \
          -x "temp/*" \
          -x ".env.debug"
        cd ..
        sha256sum instalador.zip | awk '{print $1}' > instalador.zip.sha256

    - name: Get tag name
      id: tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: "Instalador ${{ steps.tag.outputs.TAG_NAME }}"
        make_latest: true
        body: |
          ## 🛠️ Conn2Flow Instalador Release ${{ steps.tag.outputs.TAG_NAME }} (Gestor v2.9.x + Interface Moderna Tailwind)
          
          Instalador automático do sistema Conn2Flow com **suporte completo ao Gestor v2.9.x**, incluindo sistema multilíngue, layouts modernos em Tailwind CSS, hardening de segurança e arquitetura de plugins.
          
          ### ✨ Recursos e Compatibilidade:
          - ✅ **Compatibilidade Gestor v2.9.x**: Suporte a layouts administrativos e públicos Tailwind CSS e Fomantic UI
          - ✅ **Hardening de Segurança Integrado**: Validação CSRF com tokens CSPRNG, proteção de sessão e integridade com SHA-256
          - ✅ **Sistema Multilíngue Completo**: Suporte total pt-br/en com detecção inteligente de idioma
          - ✅ **Sistema Híbrido de Migração**: Execução automática de migrações Phinx com fallback SQL transacionado
          - ✅ **Validação de Requisitos e Integridade**: Verificação de extensões PHP e permissões em tempo de instalação
          
          ### 🔧 Como usar:
          1. Baixe o `instalador.zip` e confira o `instalador.zip.sha256`
          2. Extraia em seu servidor web
          3. Acesse via navegador: `http://seudominio.com/gestor-instalador/`
          4. Siga o assistente de instalação
          
          ### 📋 Requisitos:
          - PHP 8.1+ (recomendado PHP 8.3+)
          - MySQL 5.7+ ou MariaDB 10.2+
          - Extensões: zip, curl, mbstring, openssl, pdo_mysql
        draft: false
        prerelease: false
        files: |
          instalador.zip
          instalador.zip.sha256
