name: Release Gestor Instalador

on:
  push:
    tags:
      - 'instalador-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Verify synchronized release documentation
      shell: bash
      run: |
        if [[ "$GITHUB_REF_NAME" == instalador-v* ]]; then
          VERSION="${GITHUB_REF_NAME#instalador-v}"
        else
          VERSION=$(sed -n "s/.*\['versao'\].*'\([0-9][0-9.]*\)'.*/\1/p" gestor-instalador/index.php | head -n 1)
        fi
        test -s README.md
        test -s README-PT-BR.md
        test -s CHANGELOG.md
        test -n "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit)"
        find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
          while IFS= read -r -d '' workflow; do test -s "$workflow"; done
        grep -Fq "instalador-v$VERSION" README.md
        grep -Fq "instalador-v$VERSION" README-PT-BR.md
      
    - name: Create instalador.zip + checksum
      run: |
        # Criar o arquivo ZIP com apenas o gestor-instalador
        cd gestor-instalador
        zip -r ../instalador.zip . \
          -x "*.git*" \
          -x "*.DS_Store*" \
          -x "*.log*" \
          -x "temp/*" \
          -x ".env.debug"
        cd ..
        sha256sum instalador.zip | awk '{print $1}' > instalador.zip.sha256

    - name: Get tag name
      id: tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: "Instalador ${{ steps.tag.outputs.TAG_NAME }}"
        make_latest: true
        body: |
          ## 🛠️ Conn2Flow Instalador Release ${{ steps.tag.outputs.TAG_NAME }} (Instalador Web Automatizado v2.0.0)

          Instalador web automatizado de última geração com **proteção ativa contra concorrência**, suporte aprimorado a múltiplos servidores web (Apache e Nginx) e compatibilidade total com a linha **Gestor v2.10.x**.

          ### ✨ Novidades Principais desta Versão (v2.0.0):
          - ✅ **Trava Concorrente e Proteção de Sessão (`InstallerGuard`)**: Trava atômica de sessão com chave de segurança SHA-256, expiração defensiva por timeout (30 minutos) e proteção contra múltiplas instalações simultâneas.
          - ✅ **Detecção Avançada de Servidor Web**: Identificação e normalização dinâmica de servidores Apache e Nginx, com geração nativa de snippets otimizados de rewrite (`@c2f_rewrite` com `try_files` e tratamento de query strings).
          - ✅ **Resolução Canônica de Raiz de Instalação**: Detecção infalível da `url_raiz` em execuções web ou headless/CLI, preservando subpastas sem vazamento de caminhos físicos do servidor.
          - ✅ **Limpeza Defensiva Pós-Instalação**: Remoção atômica e segura de chaves temporárias, travas e fontes do instalador após o bootstrap inicial.
          - ✅ **Compatibilidade Nativa com Gestor v2.10.x**: Suporte a layouts Tailwind v4 compilados, banco de dados transacionado e assets locais.

          ### 🌟 Recursos e Destaques Consolidados:
          - **Validação de Integridade**: Checksum SHA-256 (`instalador.zip.sha256`) e verificação rigorosa de integridade de pacote.
          - **Sistema Multilíngue Completo**: Suporte nativo aos idiomas Português (`pt-br`) e Inglês (`en`).
          - **Migrações Híbridas de Banco**: Execução automatizada de migrações Phinx com fallback de schema SQL transacionado.
          - **Auto-login Seguro**: Conclusão da instalação com login administrativo instantâneo e transição suave para o painel.

          ### 🔧 Como Usar:
          1. Baixe o pacote `instalador.zip` e confira a integridade com `instalador.zip.sha256`
          2. Extraia o conteúdo no diretório web do seu servidor (raiz ou subpasta `/gestor-instalador/`)
          3. Acesse a URL pelo navegador (ex: `http://seu-dominio.com/gestor-instalador/`)
          4. Siga as etapas guiadas pelo assistente de instalação web

          ### 📋 Requisitos do Servidor:
          - Servidor Web: Apache com `mod_rewrite` habilitado ou Nginx
          - PHP 8.1+ (Recomendado PHP 8.3 ou 8.4)
          - MySQL 5.7+ ou MariaDB 10.2+
          - Extensões PHP obrigatórias: `curl, zip, pdo_mysql, openssl, mbstring, pdo_sqlite`
        draft: false
        prerelease: false
        files: |
          instalador.zip
          instalador.zip.sha256

    - name: Clean up older tags and releases in the same series
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CURRENT_TAG="${{ steps.tag.outputs.TAG_NAME }}"
        if [[ "$CURRENT_TAG" =~ ^instalador-v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
          TAG_SERIES="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
        else
          echo "Unexpected Instalador tag format: $CURRENT_TAG"
          exit 1
        fi
        OLD_TAG_PATTERN="instalador-v${TAG_SERIES}.*"
        echo "Cleaning up older releases and tags matching $OLD_TAG_PATTERN (preserving $CURRENT_TAG)..."

        OLD_TAGS=$(git tag --list "$OLD_TAG_PATTERN" | grep -Fxv "$CURRENT_TAG" || true)
        for tag in $OLD_TAGS; do
          if [ -n "$tag" ]; then
            echo "Removing older release and tag: $tag"
            gh release delete "$tag" --yes 2>/dev/null || true
            git push origin --delete "$tag" 2>/dev/null || true
          fi
        done
