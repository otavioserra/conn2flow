name: Release Gestor Instalador

on:
  push:
    tags:
      - 'instalador-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Create instalador.zip + checksum
      run: |
        # Criar o arquivo ZIP com apenas o gestor-instalador
        cd gestor-instalador
        zip -r ../instalador.zip . \
          -x "*.git*" \
          -x "*.DS_Store*" \
          -x "*.log*" \
          -x "temp/*" \
          -x ".env.debug"
        cd ..
        sha256sum instalador.zip | awk '{print $1}' > instalador.zip.sha256

    - name: Get tag name
      id: tag
      run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: "Instalador ${{ steps.tag.outputs.TAG_NAME }}"
        make_latest: true
        body: |
          ## 🛠️ Conn2Flow Instalador Release ${{ steps.tag.outputs.TAG_NAME }} (Compatibilidade com Gestor v2.9.x + Layouts Tailwind v4 + Hardening de Segurança)

          Instalador web automatizado do sistema Conn2Flow com **suporte completo aos novos recursos do Gestor v2.9.x**, incluindo sistema multilíngue completo, suporte a layouts em Tailwind CSS v4, hardening avançado de segurança e arquitetura modular.

          ### ✨ Recursos e Destaques desta Versão:
          - ✅ **Compatibilidade Total com Gestor v2.9.x**: Suporte completo a instalações com layouts administrativos e públicos em Tailwind CSS v4 e Fomantic UI.
          - ✅ **Hardening de Segurança Integrado**: Validação de integridade de pacotes com checksum SHA-256 (`instalador.zip.sha256`), tokens CSRF via CSPRNG e proteção reforçada de sessões.
          - ✅ **Sistema Multilíngue Completo**: Suporte nativo aos idiomas Português (pt-br) e Inglês (en) durante a instalação e configuração inicial.
          - ✅ **Sistema Híbrido de Migração de Banco**: Execução automática de migrações Phinx com fallback de schema SQL transacionado em lotes seguros.
          - ✅ **Detecção Inteligente de Ambiente**: Reconhecimento automático de instalação em raiz de domínio ou subpastas com configuração transparente do `.htaccess`.
          - ✅ **Auto-login e Conclusão Segura**: Configuração automática pós-instalação e remoção segura dos scripts de instalação após a conclusão.

          ### 🔧 Como Usar:
          1. Baixe o pacote `instalador.zip` e confira a integridade com `instalador.zip.sha256`
          2. Extraia o conteúdo no diretório web do seu servidor (raiz ou subpasta `/gestor-instalador/`)
          3. Acesse a URL pelo navegador (ex: `http://seu-dominio.com/gestor-instalador/`)
          4. Siga as etapas guiadas pelo assistente de instalação web

          ### 📋 Requisitos do Servidor:
          - Servidor Web: Apache com `mod_rewrite` habilitado ou Nginx
          - PHP 8.1+ (Recomendado PHP 8.3 ou 8.4)
          - MySQL 5.7+ ou MariaDB 10.2+
          - Extensões PHP obrigatórias: `curl, zip, pdo_mysql, openssl, mbstring, pdo_sqlite`
        draft: false
        prerelease: false
        files: |
          instalador.zip
          instalador.zip.sha256

    - name: Clean up older tags and releases in the same series
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CURRENT_TAG="${{ steps.tag.outputs.TAG_NAME }}"
        if [[ "$CURRENT_TAG" =~ ^instalador-v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
          TAG_SERIES="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
        else
          echo "Unexpected Instalador tag format: $CURRENT_TAG"
          exit 1
        fi
        OLD_TAG_PATTERN="instalador-v${TAG_SERIES}.*"
        echo "Cleaning up older releases and tags matching $OLD_TAG_PATTERN (preserving $CURRENT_TAG)..."

        OLD_TAGS=$(git tag --list "$OLD_TAG_PATTERN" | grep -Fxv "$CURRENT_TAG" || true)
        for tag in $OLD_TAGS; do
          if [ -n "$tag" ]; then
            echo "Removing older release and tag: $tag"
            gh release delete "$tag" --yes 2>/dev/null || true
            git push origin --delete "$tag" 2>/dev/null || true
          fi
        done
