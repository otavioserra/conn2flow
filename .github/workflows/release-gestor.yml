name: Release Gestor

on:
  push:
    tags:
      - 'gestor-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: conn2flow_test
          MYSQL_USER: conn2flow_user
          MYSQL_PASSWORD: conn2flow_pass
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify synchronized release documentation
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == gestor-v* ]]; then
            VERSION="${GITHUB_REF_NAME#gestor-v}"
          else
            VERSION=$(sed -n "s/.*\['versao'\].*'\([0-9][0-9.]*\)'.*/\1/p" gestor/config.php | head -n 1)
          fi
          test -s README.md
          test -s README-PT-BR.md
          test -s CHANGELOG.md
          test -n "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print -quit)"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            while IFS= read -r -d '' workflow; do test -s "$workflow"; done
          grep -Fq "v$VERSION" README.md
          grep -Fq "v$VERSION" README-PT-BR.md
          grep -Fq "[$VERSION]" CHANGELOG.md

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, libxml, mbstring, mysqli, pdo_mysql, openssl, tokenizer, xml, xmlwriter, zip, curl
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=64M, memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Install PHP test dependencies (root)
        run: composer install --no-interaction --prefer-dist

      - name: Install gestor runtime dependencies
        run: composer install --working-dir=gestor --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          mkdir -p gestor/autenticacoes/localhost
          cat > gestor/autenticacoes/localhost/.env <<'EOF'
          DB_CONNECTION=mysqli
          DB_HOST=127.0.0.1
          DB_DATABASE=conn2flow_test
          DB_USERNAME=conn2flow_user
          DB_PASSWORD=conn2flow_pass
          LANGUAGE_DEFAULT=pt-br
          LANGUAGES=pt-br,en
          SESSION_AUTHNAME=_C2F_TEST_SID
          COOKIE_AUTHNAME=_C2F_TEST_CID
          COOKIE_VERIFY=_C2F_TEST_VID
          LANGUAGE_COOKIE=_C2F_TEST_LANG
          OPENSSL_PASSWORD=conn2flow-tests
          USUARIO_HASH_PASSWORD=conn2flow-tests
          EOF

      - name: Run Phinx migrations
        run: php gestor/vendor/bin/phinx migrate -c gestor/phinx.php -e gestor

      - name: Run PHPUnit (Backend Tests)
        run: composer test
        env:
          CONN2FLOW_TEST_BOOTSTRAP_CONFIG: '1'
          CONN2FLOW_RUN_DB_TESTS: '1'

      - name: Run Vitest (Frontend Tests)
        run: npm run test

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright (E2E Tests)
        run: npm run test:e2e

      # ===== BUILD & RELEASE STAGE (Executado imediatamente no mesmo runner após os testes) =====

      - name: Remove resource files
        run: |
          # Remove all resource files and directory to make installation lighter
          rm -rf gestor/resources/ && rmdir gestor/resources/ 2>/dev/null || true

          # Remove module resource files recursively
          find gestor/modulos -type d -name "resources" -exec rm -rf {} + || true

          # Remove temporary npm files from Tailwind compilation
          rm -rf gestor/node_modules/ gestor/package.json gestor/package-lock.json node_modules/ package.json package-lock.json || true

          echo "All resource files removed from release"

      - name: Create gestor.zip + checksum
        run: |
          # Remove arquivos desnecessários se existirem
          rm -rf gestor/.git* || true
          # Dependências instaladas a partir do source podem conter seus próprios
          # repositórios Git; remova-os antes de criar o artefato de produção.
          find gestor -type d -name '.git' -prune -exec rm -rf {} +
          rm -rf gestor/vendor/bin/.phpunit* || true
          rm -rf gestor/vendor/composer/tmp-* || true

          # Falha defensivamente se algum metadado Git ainda estiver no staging.
          if [ -n "$(find gestor -type d -name '.git' -print -quit)" ]; then
            echo "Nested .git directory found in release staging"
            exit 1
          fi

          # Remover somente .env sensíveis da raiz (preservar templates em autenticacoes.exemplo)
          find gestor -maxdepth 1 -type f -name '.env*' -exec rm -f {} + 2>/dev/null || true
          # Remover .env internos reais de autenticacoes, exceto os de templates
          if [ -d gestor/autenticacoes ]; then
            find gestor/autenticacoes -type f -name '.env*' -not -path '*/autenticacoes.exemplo/*' -exec rm -f {} + 2>/dev/null || true
          fi

          # Criar o arquivo ZIP (resource files already removed)
          cd gestor
          zip -r ../gestor.zip . \
            -x "*.git*" \
            -x "vendor/bin/.phpunit*" \
            -x "vendor/composer/tmp-*" \
            -x "node_modules/*" \
            -x "*.DS_Store*" \
            -x "*.log*" \
            -x "tests/*" \
            -x "phpunit.xml*" \
            -x "resources/*" \
            -x "modulos/*/resources/*"
          cd ..
          sha256sum gestor.zip | awk '{print $1}' > gestor.zip.sha256

      - name: Get tag name
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep "versao" gestor/config.php | grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+" | head -1)
            if [ -n "$VERSION" ]; then
              echo "TAG_NAME=gestor-v${VERSION}" >> $GITHUB_OUTPUT
            else
              echo "TAG_NAME=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Gestor ${{ steps.tag.outputs.TAG_NAME }}"
          make_latest: true
          body: |
            ## 🚀 Conn2Flow Gestor Release ${{ steps.tag.outputs.TAG_NAME }}

            Esta versão traz importantes avanços em performance, governança de CI/CD, atualizações de infraestrutura de workflows e resiliência visual no editor.

            ### 🎯 Novidades Principais desta Versão (v2.10.7):
            - ✅ **Atualização da Infraestrutura de CI/CD (Node 24)**: GitHub Actions atualizadas para os runners nativos de Node 24 (`checkout@v5`, `setup-node@v5`, `cache@v5`, `action-gh-release@v2.2.1`), eliminando totalmente avisos de depreciação do Node 20.
            - ✅ **Otimização do Pipeline de Build**: Remoção de etapas redundantes de compilação remota de recursos no CI, consumindo diretamente os artefatos pré-compilados e validados no release local.
            - ✅ **Paridade Visual Estrita no Tailwind CSS**: Governança e isolamento visual de CSS no iframe do editor e páginas públicas (`req-156` / `BATCH-158`).
            - ✅ **Engine de Tarefas Cron (`admin-cron`)**: Motor autônomo de execução de cron (`cron.php`) e CRUD administrativo para agendamento de tarefas (`cron_tarefas`).
            - ✅ **Idempotência de Checksums Multiplataforma**: Normalização de quebras de linha (LF/CRLF) para asserção determinística em ambientes Linux/Windows.

            ### 🌟 Destaques Consolidados das Versões Recentes:
            - **Live Editor e Site Toolbar (Editbar)**: Barra flutuante contextual no site publicado para edição in-place com mapeamento reativo ao DOM vivo.
            - **Assets Externos Locais & Zero CDN**: Bibliotecas jQuery, SortableJS, DataTables, Quill e Lucide servidas localmente do disco.
            - **Minificação Nativa no Build**: Pipeline de minificação nativa via Terser/CSS reduzindo o tamanho de assets em mais de 50%.
            - **Layouts Tailwind v4 Modernizados**: Painel administrativo responsivo e telas de autenticação atualizadas.
            - **Segurança Reforçada**: Personal Access Tokens (PAT) escopados, 2FA com TOTP/códigos de recuperação e proteção CSRF CSPRNG.

            ### 📦 Conteúdo da Release:
            - Sistema gestor completo otimizado
            - Migrações de banco de dados Phinx com execução automática
            - Dependências Composer e assets compilados do Tailwind CSS CLI
            - Verificação de integridade via checksum SHA-256 (`gestor.zip.sha256`)

            ### 🔧 Como Usar / Atualizar:
            1. Atualização automática via terminal: `c2f manager:update-all` ou `c2f project:update`
            2. Ou use o [Conn2Flow Installer](https://github.com/otavioserra/conn2flow/releases) para instalação/atualização automatizada
            3. Ou extraia o arquivo `gestor.zip` e execute as migrações de banco de dados

            ### 📋 Requisitos do Ambiente:
            - PHP 8.1+ (Recomendado PHP 8.3+)
            - MySQL 5.7+ ou MariaDB 10.2+
            - Extensões PHP: `curl, zip, pdo_mysql, openssl, mbstring, dom, json`
            - Node.js 22+ / 24+ (para compilação local e testes)
          draft: false
          prerelease: false
          files: |
            gestor.zip
            gestor.zip.sha256

      - name: Clean up older tags and releases in the same series
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ steps.tag.outputs.TAG_NAME }}"
          if [[ "$CURRENT_TAG" =~ ^gestor-v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            TAG_SERIES="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "Unexpected Gestor tag format: $CURRENT_TAG"
            exit 1
          fi
          OLD_TAG_PATTERN="gestor-v${TAG_SERIES}.*"
          echo "Cleaning up older releases and tags matching $OLD_TAG_PATTERN (preserving $CURRENT_TAG)..."

          OLD_TAGS=$(git tag --list "$OLD_TAG_PATTERN" | grep -Fxv "$CURRENT_TAG" || true)
          for tag in $OLD_TAGS; do
            if [ -n "$tag" ]; then
              echo "Removing older release and tag: $tag"
              gh release delete "$tag" --yes 2>/dev/null || true
              git push origin --delete "$tag" 2>/dev/null || true
            fi
          done
