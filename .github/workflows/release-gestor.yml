name: Release Gestor

on:
  push:
    tags:
      - 'gestor-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: conn2flow_test
          MYSQL_USER: conn2flow_user
          MYSQL_PASSWORD: conn2flow_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, libxml, mbstring, mysqli, pdo_mysql, openssl, tokenizer, xml, xmlwriter, zip, curl
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP test dependencies (root)
        run: composer install --no-interaction --prefer-dist

      - name: Install gestor runtime dependencies
        run: composer install --working-dir=gestor --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          mkdir -p gestor/autenticacoes/localhost
          cat > gestor/autenticacoes/localhost/.env <<'EOF'
          DB_CONNECTION=mysqli
          DB_HOST=127.0.0.1
          DB_DATABASE=conn2flow_test
          DB_USERNAME=conn2flow_user
          DB_PASSWORD=conn2flow_pass
          LANGUAGE_DEFAULT=pt-br
          LANGUAGES=pt-br,en
          SESSION_AUTHNAME=_C2F_TEST_SID
          COOKIE_AUTHNAME=_C2F_TEST_CID
          COOKIE_VERIFY=_C2F_TEST_VID
          LANGUAGE_COOKIE=_C2F_TEST_LANG
          OPENSSL_PASSWORD=conn2flow-tests
          USUARIO_HASH_PASSWORD=conn2flow-tests
          EOF

      - name: Run Phinx migrations
        run: php gestor/vendor/bin/phinx migrate -c gestor/phinx.php -e gestor

      - name: Run PHPUnit (Backend Tests)
        run: composer test
        env:
          CONN2FLOW_TEST_BOOTSTRAP_CONFIG: '1'
          CONN2FLOW_RUN_DB_TESTS: '1'

      - name: Run Vitest (Frontend Tests)
        run: npm run test

      - name: Install Playwright browser and OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies if browser cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright (E2E Tests)
        run: npm run test:e2e

      # ===== BUILD & RELEASE STAGE (Executado imediatamente no mesmo runner após os testes) =====

      - name: Generate resources and per-resource Tailwind CSS
        run: |
          php gestor/controladores/agents/arquitetura/atualizacao-dados-recursos.php
          echo "Resource updates generated successfully"

      - name: Commit Resources Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gestor/db/data/*.json
          git add gestor/db/orphans/*.json
          git add gestor/resources/*
          git add gestor/resources/.tailwind-build-manifest.json
          git add gestor/modulos/*/*.json
          git add gestor/modulos/*/resources
          git add gestor/assets/tailwindcss/*.css
          git add gestor/assets/asset-versions.json
          git add gestor/contents/asset-version.json
          git diff --cached --quiet || git commit -m "Auto-update resources for release ${{ github.ref_name }}"

      - name: Remove resource files
        run: |
          # Remove all resource files and directory to make installation lighter
          rm -rf gestor/resources/ && rmdir gestor/resources/ 2>/dev/null || true

          # Remove module resource files recursively
          find gestor/modulos -type d -name "resources" -exec rm -rf {} + || true

          # Remove temporary npm files from Tailwind compilation
          rm -rf gestor/node_modules/ gestor/package.json gestor/package-lock.json node_modules/ package.json package-lock.json || true

          echo "All resource files removed from release"

      - name: Create gestor.zip + checksum
        run: |
          # Remove arquivos desnecessários se existirem
          rm -rf gestor/.git* || true
          # Dependências instaladas a partir do source podem conter seus próprios
          # repositórios Git; remova-os antes de criar o artefato de produção.
          find gestor -type d -name '.git' -prune -exec rm -rf {} +
          rm -rf gestor/vendor/bin/.phpunit* || true
          rm -rf gestor/vendor/composer/tmp-* || true

          # Falha defensivamente se algum metadado Git ainda estiver no staging.
          if [ -n "$(find gestor -type d -name '.git' -print -quit)" ]; then
            echo "Nested .git directory found in release staging"
            exit 1
          fi

          # Remover somente .env sensíveis da raiz (preservar templates em autenticacoes.exemplo)
          find gestor -maxdepth 1 -type f -name '.env*' -exec rm -f {} + 2>/dev/null || true
          # Remover .env internos reais de autenticacoes, exceto os de templates
          if [ -d gestor/autenticacoes ]; then
            find gestor/autenticacoes -type f -name '.env*' -not -path '*/autenticacoes.exemplo/*' -exec rm -f {} + 2>/dev/null || true
          fi

          # Criar o arquivo ZIP (resource files already removed)
          cd gestor
          zip -r ../gestor.zip . \
            -x "*.git*" \
            -x "vendor/bin/.phpunit*" \
            -x "vendor/composer/tmp-*" \
            -x "node_modules/*" \
            -x "*.DS_Store*" \
            -x "*.log*" \
            -x "tests/*" \
            -x "phpunit.xml*" \
            -x "resources/*" \
            -x "modulos/*/resources/*"
          cd ..
          sha256sum gestor.zip | awk '{print $1}' > gestor.zip.sha256

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Gestor ${{ steps.tag.outputs.TAG_NAME }}"
          make_latest: true
          draft: false
          prerelease: false
          files: |
            gestor.zip
            gestor.zip.sha256
