name: Release Gestor

on:
  push:
    tags:
      - 'gestor-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: conn2flow_test
          MYSQL_USER: conn2flow_user
          MYSQL_PASSWORD: conn2flow_pass
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, json, libxml, mbstring, mysqli, pdo_mysql, openssl, tokenizer, xml, xmlwriter, zip, curl
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=64M, memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Install PHP test dependencies (root)
        run: composer install --no-interaction --prefer-dist

      - name: Install gestor runtime dependencies
        run: composer install --working-dir=gestor --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          mkdir -p gestor/autenticacoes/localhost
          cat > gestor/autenticacoes/localhost/.env <<'EOF'
          DB_CONNECTION=mysqli
          DB_HOST=127.0.0.1
          DB_DATABASE=conn2flow_test
          DB_USERNAME=conn2flow_user
          DB_PASSWORD=conn2flow_pass
          LANGUAGE_DEFAULT=pt-br
          LANGUAGES=pt-br,en
          SESSION_AUTHNAME=_C2F_TEST_SID
          COOKIE_AUTHNAME=_C2F_TEST_CID
          COOKIE_VERIFY=_C2F_TEST_VID
          LANGUAGE_COOKIE=_C2F_TEST_LANG
          OPENSSL_PASSWORD=conn2flow-tests
          USUARIO_HASH_PASSWORD=conn2flow-tests
          EOF

      - name: Run Phinx migrations
        run: php gestor/vendor/bin/phinx migrate -c gestor/phinx.php -e gestor

      - name: Run PHPUnit (Backend Tests)
        run: composer test
        env:
          CONN2FLOW_TEST_BOOTSTRAP_CONFIG: '1'
          CONN2FLOW_RUN_DB_TESTS: '1'

      - name: Run Vitest (Frontend Tests)
        run: npm run test

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright (E2E Tests)
        run: npm run test:e2e

      # ===== BUILD & RELEASE STAGE (Executado imediatamente no mesmo runner após os testes) =====

      - name: Generate resources and per-resource Tailwind CSS
        run: |
          php gestor/controladores/agents/arquitetura/atualizacao-dados-recursos.php
          echo "Resource updates generated successfully"

      - name: Commit Resources Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gestor/db/data/*.json
          git add gestor/db/orphans/*.json
          git add gestor/resources/*
          git add gestor/resources/.tailwind-build-manifest.json
          git add gestor/modulos/*/*.json
          git add gestor/modulos/*/resources
          git add gestor/assets/tailwindcss/*.css
          git add gestor/assets/asset-versions.json
          git add gestor/contents/asset-version.json
          git diff --cached --quiet || git commit -m "Auto-update resources for release ${{ github.ref_name }}"

      - name: Remove resource files
        run: |
          # Remove all resource files and directory to make installation lighter
          rm -rf gestor/resources/ && rmdir gestor/resources/ 2>/dev/null || true

          # Remove module resource files recursively
          find gestor/modulos -type d -name "resources" -exec rm -rf {} + || true

          # Remove temporary npm files from Tailwind compilation
          rm -rf gestor/node_modules/ gestor/package.json gestor/package-lock.json node_modules/ package.json package-lock.json || true

          echo "All resource files removed from release"

      - name: Create gestor.zip + checksum
        run: |
          # Remove arquivos desnecessários se existirem
          rm -rf gestor/.git* || true
          # Dependências instaladas a partir do source podem conter seus próprios
          # repositórios Git; remova-os antes de criar o artefato de produção.
          find gestor -type d -name '.git' -prune -exec rm -rf {} +
          rm -rf gestor/vendor/bin/.phpunit* || true
          rm -rf gestor/vendor/composer/tmp-* || true

          # Falha defensivamente se algum metadado Git ainda estiver no staging.
          if [ -n "$(find gestor -type d -name '.git' -print -quit)" ]; then
            echo "Nested .git directory found in release staging"
            exit 1
          fi

          # Remover somente .env sensíveis da raiz (preservar templates em autenticacoes.exemplo)
          find gestor -maxdepth 1 -type f -name '.env*' -exec rm -f {} + 2>/dev/null || true
          # Remover .env internos reais de autenticacoes, exceto os de templates
          if [ -d gestor/autenticacoes ]; then
            find gestor/autenticacoes -type f -name '.env*' -not -path '*/autenticacoes.exemplo/*' -exec rm -f {} + 2>/dev/null || true
          fi

          # Criar o arquivo ZIP (resource files already removed)
          cd gestor
          zip -r ../gestor.zip . \
            -x "*.git*" \
            -x "vendor/bin/.phpunit*" \
            -x "vendor/composer/tmp-*" \
            -x "node_modules/*" \
            -x "*.DS_Store*" \
            -x "*.log*" \
            -x "tests/*" \
            -x "phpunit.xml*" \
            -x "resources/*" \
            -x "modulos/*/resources/*"
          cd ..
          sha256sum gestor.zip | awk '{print $1}' > gestor.zip.sha256

      - name: Get tag name
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(php -r "include 'gestor/config.php'; echo \$_GESTOR['versao'] ?? '';")
            if [ -n "$VERSION" ]; then
              echo "TAG_NAME=gestor-v${VERSION}" >> $GITHUB_OUTPUT
            else
              echo "TAG_NAME=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Gestor ${{ steps.tag.outputs.TAG_NAME }}"
          make_latest: true
          body: |
            ## 🚀 Conn2Flow Gestor Release ${{ steps.tag.outputs.TAG_NAME }} (Live Editor + Layouts Tailwind v4 + Pull System + Suporte Híbrido a PDF e Streaming)

            Esta versão consolida grandes inovações no core do Conn2Flow, incluindo o novo **Live Editor (Site Toolbar / Editbar)** com edição contextual in-place, modernização completa de **Layouts Administrativo e Público em Tailwind CSS v4** com paleta azul Conn2Flow (`sky`), **Sistema de Engenharia Reversa e Sincronização Declarativa (Pull Engine)**, suporte híbrido a visualizador de PDF (PDF.js / Google Viewer / Object), **Streaming de Mídia via HTTP Range (206)**, Personal Access Tokens (**PAT**) e novas bibliotecas de pagamento (**PayPal 3.1.0 e Stripe**).

            ### 🎯 Novidades Principais desta Versão:
            - ✅ **Live Editor e Site Toolbar (Editbar)**: Barra flutuante contextual no site publicado para edição in-place com mapeamento reativo ao DOM vivo, travas para widgets, escudo de proteção contra cliques acidentais e painéis integrados (Inserção "+", Modelos, Backups, Assistente IA com CodeMirror e Código Customizado).
            - ✅ **Área de Transferência Persistente**: Armazenamento no `localStorage` permitindo copiar elementos e blocos estruturais em uma página e colar ou substituir em outra página/aba diferente.
            - ✅ **Painel de Opções de Exibição do Editor**: Sidebar Lateral de CSS (classes Tailwind agrupadas por variante, classes customizadas, CSS inline CodeMirror, inspetor de computed style) e Barra Superior de Navegação (Element Navbar).
            - ✅ **Modernização Visual e Layouts Tailwind v4**: Novo `layout-administrativo-tailwind` com menu responsivo Lucide Icons, redimensionamento dinâmico (220–450px) e filtro instantâneo por digitação/teclado. Novo `layout-pagina-sem-permissao-tailwind` com 15 telas de identidade migradas para Tailwind puro na paleta azul Conn2Flow (`sky`).
            - ✅ **Painel de Perfil do Usuário**: Interface moderna em abas com gerenciamento e revogação de sessões ativas e histórico detalhado de acessos.
            - ✅ **Sincronização Declarativa e Engenharia Reversa (Pull Engine)**: Motor de sincronização declarativa via `tables_config.json` e recuperação reversa de recursos via `_api/project/recover` com suporte a subpastas estruturadas (`<tabela>/<id>/<id>.<ext>`) e resolução inteligente de conflitos em `contents/`.
            - ✅ **Mídia Embutida, Streaming e Suporte Híbrido a PDF**: Invólucro atômico `.conn2flow-embed-wrapper` com redimensionamento, leitor próprio baseado em PDF.js (`pdf-viewer.js`) com canvas/zoom/toolbar, suporte a Google Viewer e streaming de vídeo/áudio via cabeçalhos HTTP Range (206 Partial Content).
            - ✅ **Gerenciador de Arquivos (Admin-Arquivos)**: Transição para árvore física de diretórios no disco, com upload e criação de pastas liberados dentro do seletor em modal (modo Picker/iframe) e persistência da última pasta navegada.
            - ✅ **Novos Módulos e Funcionalidades**: Módulo `forms-search` (autocomplete AJAX), `pages-index` (destaques e paginação dinâmica), transferência de publicações entre publicadores no `publisher-pages` com registro automático de 301, e customização de labels/ordenação em `modulos-grupos`.
            - ✅ **Gateways de Pagamento Integrados**: Biblioteca PayPal 3.1.0 com Checkout Transparente e Card Fields nativos, e biblioteca core Stripe completa (Payment Element, Billing, Assinaturas, Webhooks HMAC e Catálogo de Produtos/Preços).
            - ✅ **Segurança e PAT**: Personal Access Tokens (`c2f_pat_`) com hash SHA-256 e códigos de recuperação 2FA (Recovery Codes), tolerância a schema drift com degradação graciosa e proteção contra CSRF ampla.
            - ✅ **SEO, Sitemap XML e Robots**: Metadados dedicados de SEO/Open Graph por página, geração automática de `assets/sitemap.xml` e `assets/robots.txt`.
            - ✅ **Subsistema CLI Moderno**: CLI orientada a objetos em `/cli` e binário `c2f` com catálogo completo de comandos.

            ### 📦 Conteúdo da Release:
            - Sistema gestor completo otimizado
            - Migrações de banco de dados Phinx com execução automática
            - Dependências Composer e assets compilados do Tailwind CSS CLI
            - Verificação de integridade via checksum SHA-256 (`gestor.zip.sha256`)

            ### 🔧 Como Usar / Atualizar:
            1. Atualização automática via terminal: `c2f manager:update-all` ou `c2f project:update`
            2. Ou use o [Conn2Flow Installer](https://github.com/otavioserra/conn2flow/releases) para instalação/atualização automatizada
            3. Ou extraia o arquivo `gestor.zip` e execute as migrações de banco de dados

            ### 📋 Requisitos do Ambiente:
            - PHP 8.1+ (Recomendado PHP 8.3+)
            - MySQL 5.7+ ou MariaDB 10.2+
            - Extensões PHP: `curl, zip, pdo_mysql, openssl, mbstring, dom, json`
            - Node.js 22+ / 24+ (para compilação local e testes)
          draft: false
          prerelease: false
          files: |
            gestor.zip
            gestor.zip.sha256

